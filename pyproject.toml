[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-quant-lab"
version = "0.1.0"
description = "Point-in-time A-share research infrastructure; Phase 0 engineering only"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pyarrow==19.0.1",
  "duckdb==1.3.2",
  "pyqlib==0.9.7",
  "lightgbm==4.6.0",
  "torch==2.7.1",
  "mlflow==2.22.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.2"]

[project.scripts]
ashare-lab = "ashare_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cu118", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
